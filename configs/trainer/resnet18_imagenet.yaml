model:
  type: resnet18
  batch_norm: true
experiment:
  epochs: 100
  save_every: 300
  eval_every: 5
  patience: 15
  metrics: ifc          # streaming IFC: the stored-embedding metrics do not fit in memory at 224x224
optimizer:
  lr: 0.1
  name: SGD
  sep_decay: false
  weight_decay: 0.0001
  momentum: 0.9
scheduler:
  decay_type: step_30_60_90
  div_factor: 10
  epochs: 100
  final_div_factor: 1000
  gamma: 0.1
  max_lr: 0.01
  patience: 30
  warmup_epochs: 5
