model:
  type: mlp_12
  batch_norm: true
experiment:
  epochs: 300
  save_every: 300
  eval_every: 5
  patience: 15
optimizer:
  lr: 0.05
  name: SGD
  sep_decay: false
  weight_decay: 0.0
  momentum: 0.0
scheduler:
  decay_type: step_100_200
  div_factor: 10
  epochs: 150
  final_div_factor: 1000
  gamma: 0.0
  max_lr: 0.01
  patience: 30
  warmup_epochs: 5
